[package]
name = "uplink1030"
default-run = "uplink1030"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
desperado.workspace = true
rs1030 = { path = "../rs1030" }
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
num-complex.workspace = true
url = "2"
shellexpand = "3"
zstd = "0.13"
futures = "0.3"
chrono = "0.4"
percent-encoding = "2"
crossterm = "0.29"
ratatui = "0.30"

[features]
default = ["file"]
file = []
hackrf = ["desperado/hackrf"]
soapy = ["desperado/soapy"]
airspy = ["desperado/airspy"]
pluto = ["desperado/pluto"]
